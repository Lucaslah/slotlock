name: Build

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: openjdk:21-jdk
      options: --user root
    
    steps:
    - uses: actions/checkout@v2.2.0
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - run: |
          ./gradlew build
    - uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: build/libs/